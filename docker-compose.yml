


services:

#==postgres database ====================================
  db:
    image: postgres:alpine
    restart: unless-stopped

    container_name: fastapi-postgres

    environment:
      POSTGRES_DB: MYDB
      POSTGRES_USER: ADMIN
      POSTGRES_PASSWORD: "2371"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      #- ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    
    networks:
      - fileserver_net
    healthcheck:

        test: ["CMD-SHELL", "pg_isready -U ADMIN -d MYDB"]
        interval: 5s
        timeout: 3s
        retries: 5
    
#==fastapiserver===============================================
  fastapi_app:
    build: ./
    restart: unless-stopped
    volumes:
      - ./:/app

    ports:
      - "8000:8000"

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      POSTGRES_DB: MYDB
      POSTGRES_USER: ADMIN
      POSTGRES_PASSWORD: "2371"
      DATABASE_URL: "postgresql://ADMIN:2371@db:5432/MYDB"

    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

    networks:
      - fileserver_net

#==ollamaserver====================================================

  ollama:
    image: ollama/ollama
    ports: 
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    command: ["serve"]
    networks:
      - fileserver_net


#===Prometheus=========================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro          #copying te yml file to put inside ocntainer and :ro means read only      #
    ports:
      - '9090:9090'

    networks:
    - fileserver_net

#===Grafana=============================================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - '3000:3000'
    depends_on:
      -  prometheus
    networks:
    - fileserver_net

     
    
volumes:
  pgdata:
  ollama:
    external: true
  prometheus:

networks:
  fileserver_net:








