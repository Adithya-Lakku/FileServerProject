<!DOCTYPE html>
<html>
<head>
    <title>File List</title>
</head>
<body>


    <h2>List files</h2>
    
    <ul>
        {% for file in files %}
            <li>{{ file[1] }}</li> 
            <form action="/download" method="post" style="display:inline;"> 
            <input type="hidden" name="file_id" value="{{ file[0] }}">
            <button type="submit">Download</button> 
            </form>


            <form action="/delete" method="post" style="display:inline;"> 
            <input type="hidden" name="file_id" value="{{ file[0] }}">
            <button type="submit">Delete</button> 
            </form>
            <br>
            <br>

        {% endfor %}
    </ul>

    <form action = "/">
        <button type="submit">
            return to home
        </button>
    </form>


    
</body>
</html>
