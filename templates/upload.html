<!DOCTYPE html>
<html>
<head>
    <title>File Uploaded</title>
</head>
<body>


    <h3>
        {% for filename in filenames %}
        <h3>
            uploaded file : {{filename}}
        </h3>

        {% endfor %}
    
    
    </h3>


    
    <form action="/files/{{ current_path }}" method="get">
        <button type="submit">Return to Folder</button>
    </form>
    <br>
    <form action="/" method="get">
        <button type="submit">Return to Home</button>
    </form>
    
</body>
</html>
